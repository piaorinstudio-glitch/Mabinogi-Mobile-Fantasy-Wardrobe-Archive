name: 套用首頁圖片與最終排版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hero-images-final-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final layout
        run: python scripts/apply_hero_images_final_layout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html image/hero-campfire.png image/hero-friends.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply final hero images and layout"
          git push
