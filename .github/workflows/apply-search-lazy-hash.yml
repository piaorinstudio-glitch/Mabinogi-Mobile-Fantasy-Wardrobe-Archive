name: 新增搜尋與網址優化

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-search-lazy-hash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply search lazy hash patch
        run: python scripts/apply_search_lazy_hash_patch.py

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add search lazy loading and hash URLs"
          git push
