name: 修正最終拼貼版排版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-scrapbook-layout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply scrapbook layout polish
        run: python scripts/apply_scrapbook_layout_polish.py

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Polish scrapbook layout"
          git push
