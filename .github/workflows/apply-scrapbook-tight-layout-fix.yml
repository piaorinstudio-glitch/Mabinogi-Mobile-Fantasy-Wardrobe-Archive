name: 修正拼貼版標題搜尋排版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-scrapbook-tight-layout-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply scrapbook tight layout fix
        run: python scripts/apply_scrapbook_tight_layout_fix.py

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix scrapbook title search layout"
          git push
