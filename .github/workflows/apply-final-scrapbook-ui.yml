name: 套用最終拼貼版 UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-scrapbook-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final scrapbook UI
        run: python scripts/apply_final_scrapbook_ui.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply final scrapbook UI layout"
          git push
