name: 修正手機工具列排版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-mobile-toolbar-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply mobile toolbar layout fix
        run: python scripts/apply_mobile_toolbar_fix.py

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix mobile toolbar layout"
          git push
