name: 套用頁尾署名

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-credit-footer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply credit footer
        run: python scripts/apply_credit_footer.py

      - name: Commit footer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add site credit footer"
          git push
