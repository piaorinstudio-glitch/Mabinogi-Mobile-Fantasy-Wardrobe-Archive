name: 套用柔綠可愛 UI 風格

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-soft-green-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply soft green UI redesign
        run: python scripts/apply_soft_green_ui.py

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply soft green UI redesign"
          git push
