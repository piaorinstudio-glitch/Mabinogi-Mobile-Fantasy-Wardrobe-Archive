<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>瑪奇Mobile韓服外觀圖鑑</title>
<style>

:root{
  --bg:#edf2ea;
  --bg-2:#f7f3ea;
  --surface:#fffdf8;
  --surface-2:#fbf7ef;
  --ink:#2d352e;
  --muted:#667164;
  --line:#d9d1c2;
  --line-2:#c7b896;
  --green:#2f5f4f;
  --green-2:#476e5a;
  --green-3:#dfe9df;
  --gold:#b89045;
  --gold-2:#8f6d2f;
  --berry:#744056;
  --shadow:0 16px 34px rgba(43,58,47,.10);
  --shadow-deep:0 22px 70px rgba(33,44,35,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(110,150,123,.16), transparent 26%),
    radial-gradient(circle at top right, rgba(195,167,102,.16), transparent 24%),
    linear-gradient(180deg, #eef4eb 0%, #f7f1e6 48%, #edf2ea 100%);
}
button,select{font:inherit}
.wrap{width:min(1020px,calc(100% - 28px));margin:auto}

.hero{
  position:relative;
  overflow:hidden;
  color:#fff;
  padding:44px 0 34px;
  background:
    radial-gradient(circle at 14% 18%, rgba(255,255,255,.14), transparent 18%),
    radial-gradient(circle at 84% 18%, rgba(255,255,255,.10), transparent 22%),
    linear-gradient(135deg, #24463b 0%, #35634f 48%, #607052 100%);
  box-shadow:0 6px 24px rgba(0,0,0,.12);
}
.hero::before,
.hero::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:28px;
  transform:rotate(45deg);
  pointer-events:none;
}
.hero::before{left:-82px;top:-114px}
.hero::after{right:-96px;bottom:-136px}
.hero-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;z-index:1}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  border-radius:999px;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:900;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.eyebrow::before{content:"✦";font-size:10px;opacity:.9}
h1{
  margin:14px 0 8px;
  font-size:clamp(32px,5vw,50px);
  line-height:1.08;
  letter-spacing:-.04em;
  font-family:"Noto Serif TC",Georgia,serif;
  text-shadow:0 2px 10px rgba(0,0,0,.12);
}
.subtitle{display:none;margin:0;max-width:700px;opacity:.92;line-height:1.8;font-size:14px;}
.source-btn{
  flex:none;
  height:42px;
  border:1px solid rgba(255,255,255,.26);
  background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.09));
  color:#fff;
  border-radius:999px;
  padding:0 14px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
}
.source-btn:hover{background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.12))}

.toolbar-shell{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(248,244,236,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(201,188,160,.72);
  box-shadow:0 7px 20px rgba(65,74,62,.05);
}
.toolbar{padding:12px 0;display:flex;align-items:center;gap:8px}
.category-nav{display:flex;gap:7px;flex:1;flex-wrap:wrap}
.category,.sort{
  height:41px;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg,#fffdf9,#f5efe3);
  color:var(--ink);
  border-radius:12px;
  padding:0 13px;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(46,57,47,.04);
}
.category:hover,.sort:hover{border-color:#ae9a6f;background:linear-gradient(180deg,#fffefb,#f8f1e4)}
.category.active{
  color:#fff;
  border-color:#4c6848;
  background:linear-gradient(180deg, #4c7055, #325c4d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 3px 10px rgba(50,92,77,.15);
}
.sort{font-weight:800;flex:none}

main{padding:24px 0 56px}
.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin:2px 0 14px;
}
.section-title{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:950;
  letter-spacing:-.025em;
  font-family:"Noto Serif TC",Georgia,serif;
}
.section-title::before{content:"✦";color:var(--gold);font-size:14px}
.section-note{display:none;font-size:12px;color:var(--muted);margin-top:5px}
.feed{display:flex;flex-direction:column;gap:16px}
.entry{
  position:relative;
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  background:
    linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.75)),
    linear-gradient(180deg, #fffdf8, #f7f2e9);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.18s ease;
  min-height:300px;
}
.entry::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(191,175,137,.35);
  border-radius:16px;
  pointer-events:none;
}
.entry::after{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:5px;
  background:linear-gradient(180deg, #c6a05a, #5e7a58 62%, #c6a05a);
}
.entry:hover{transform:translateY(-2px);box-shadow:var(--shadow-deep);border-color:#c8bea9}
.image-wrap{
  position:relative;
  aspect-ratio:408/340;
  background:linear-gradient(180deg,#f2ece1,#e9e3d8);
  overflow:hidden;
  cursor:zoom-in;
  align-self:stretch;
}
.image-wrap::after{
  content:"點圖放大";
  position:absolute;
  right:12px;
  bottom:12px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(34,52,45,.62);
  color:#fff;
  font-size:11px;
  font-weight:850;
  letter-spacing:.02em;
  opacity:0;
  transform:translateY(4px);
  transition:.18s ease;
}
.entry:hover .image-wrap::after{opacity:1;transform:translateY(0)}
.image-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .24s ease}
.image-wrap:hover img{transform:scale(1.015)}
.entry-info{padding:32px 34px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.entry-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.issue{
  position:relative;
  font-size:12px;
  font-weight:950;
  color:#fff;
  background:linear-gradient(180deg, #557963, #2f5f4f);
  border-radius:999px;
  padding:7px 12px;
  box-shadow:0 3px 10px rgba(47,95,79,.16);
}
.issue.limited{background:linear-gradient(180deg, #c99a4a, #9a6a24);box-shadow:0 3px 10px rgba(154,106,36,.18)}
.issue.collab{background:linear-gradient(180deg, #8b6cb2, #654987);box-shadow:0 3px 10px rgba(101,73,135,.18)}
.issue.regular{background:linear-gradient(180deg, #557963, #2f5f4f)}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.name{
  font-size:clamp(27px,3vw,34px);
  font-weight:950;
  line-height:1.23;
  letter-spacing:-.04em;
  word-break:break-word;
  font-family:"Noto Serif TC",Georgia,serif;
}
.ko{margin-top:9px;font-size:16px;font-weight:800;color:var(--green-2);line-height:1.45;word-break:break-word}

.tw-pass-row{
  margin-top:18px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:11px 13px;
  border:1px solid #d8cdae;
  border-radius:13px;
  background:linear-gradient(180deg,#fff9eb,#f8f0df);
  color:#5e5546;
  font-size:12px;
  font-weight:750;
  line-height:1.45;
}
.tw-pass-row.predicted{
  border-style:dashed;
  background:linear-gradient(180deg,#f6f8f2,#eef3eb);
  border-color:#c7d1c4;
}
.tw-pass-label{
  display:inline-flex;
  align-items:center;
  height:24px;
  padding:0 8px;
  border-radius:999px;
  background:linear-gradient(180deg,#b89146,#8d6b31);
  color:#fff;
  font-size:10px;
  font-weight:950;
  letter-spacing:.02em;
}
.tw-pass-row.predicted .tw-pass-label{background:linear-gradient(180deg,#6f8b70,#4e6d56)}
.tw-pass-period{font-variant-numeric:tabular-nums;color:#413a31}
.tw-pass-state{
  margin-left:auto;
  padding:3px 7px;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(170,151,112,.35);
  color:#735c2d;
  font-size:10px;
  font-weight:900;
}
.tw-pass-row.predicted .tw-pass-state{color:#4b6752;border-color:#c5d1c5}
.empty{
  text-align:center;
  padding:74px 20px;
  color:var(--muted);
  background:linear-gradient(180deg,#fffdf8,#f7f2e7);
  border:1px dashed var(--line-2);
  border-radius:20px;
  box-shadow:var(--shadow);
}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:"Noto Serif TC",Georgia,serif}
footer{padding:4px 0 40px;color:var(--muted);font-size:11px;text-align:center}

/* image viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(14,20,17,.86);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.viewer.open{display:flex}
.viewer img{display:block;max-width:min(1180px,96vw);max-height:92vh;object-fit:contain;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12)}
.viewer-close{position:fixed;right:16px;top:16px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,248,238,.94);color:#33413a;font-size:25px;cursor:pointer}

/* sources */
.source-modal{position:fixed;inset:0;z-index:60;background:rgba(20,27,23,.68);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
.source-modal.open{display:flex}
.source-panel{width:min(700px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#fffdf8,#f8f3ea);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.28);border:1px solid #d7ccb5}
.source-head{position:sticky;top:0;background:rgba(255,252,246,.96);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line);z-index:2}
.source-head h2{margin:0;font-size:19px;font-family:"Noto Serif TC",Georgia,serif}
.source-close{border:0;background:#efe8da;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;color:#435147}
.source-list{padding:8px 18px 20px}.source-group{padding-top:10px}
.source-group h3{font-size:15px;margin:12px 0 6px;color:var(--green);font-family:"Noto Serif TC",Georgia,serif}
.source-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #dfd7c9}
.source-label{min-width:0;font-size:12px;line-height:1.45}.source-label b{font-size:13px}
.source-links{display:flex;gap:6px}
.source-links a{text-decoration:none;color:var(--green);font-size:11px;font-weight:900;border:1px solid #cfbe94;border-radius:10px;padding:6px 9px;background:linear-gradient(180deg,#fffdfa,#f7f0e2)}

/* Taiwan lucky-box prediction */
.predict-btn{
  display:none;height:41px;border:1px solid #d1b77a;background:linear-gradient(180deg,#fff7de,#f5ead0);color:#6f5220;border-radius:12px;padding:0 13px;cursor:pointer;font-weight:900;font-size:13px;align-items:center;gap:7px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.65)
}
.predict-btn.show{display:inline-flex}
.predict-btn:hover{background:linear-gradient(180deg,#fff8e7,#f8edd4);border-color:#bea167}
.predict-dot{width:7px;height:7px;border-radius:50%;background:#c58a2c;box-shadow:0 0 0 3px rgba(197,138,44,.13)}
.prediction-modal{position:fixed;inset:0;z-index:58;background:rgba(20,27,23,.72);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
.prediction-modal.open{display:flex}
.prediction-panel{width:min(780px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#fffdf8,#f8f3e9);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.3);border:1px solid #d8cbae}
.prediction-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 19px;background:rgba(255,253,248,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.prediction-head h2{margin:0;font-size:20px;letter-spacing:-.02em;font-family:"Noto Serif TC",Georgia,serif}
.prediction-close{border:0;background:#efe8da;width:35px;height:35px;border-radius:50%;font-size:21px;cursor:pointer;flex:none;color:#435147}
.prediction-body{padding:18px 19px 22px}
.prediction-lead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:15px;padding:15px 16px;border:1px solid #e3d5b8;background:linear-gradient(180deg,#fff7e8,#fcf3df);border-radius:16px}
.prediction-lead strong{display:block;font-size:15px;margin-bottom:4px;color:#5d451c;font-family:"Noto Serif TC",Georgia,serif}
.prediction-lead p{margin:0;color:#766b5a;font-size:12px;line-height:1.68}
.prediction-badge{flex:none;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(180deg,#c29346,#9a6f2e);padding:6px 9px;border-radius:999px}
.prediction-list{display:flex;flex-direction:column;gap:12px}
.prediction-item{position:relative;display:grid;grid-template-columns:245px minmax(0,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#fffefb,#f9f4ea);min-height:190px;box-shadow:var(--shadow)}
.prediction-item::before{content:"";position:absolute;inset:10px;border:1px solid rgba(191,175,137,.32);border-radius:13px;pointer-events:none}
.prediction-image{aspect-ratio:408/340;background:#e9e7e2;overflow:hidden;cursor:zoom-in}
.prediction-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease}
.prediction-image:hover img{transform:scale(1.015)}
.prediction-info{padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
.prediction-order{font-size:11px;font-weight:900;color:#9b6b24;letter-spacing:.04em;margin-bottom:8px}
.prediction-meta{font-size:12px;color:var(--muted);margin-bottom:7px;font-variant-numeric:tabular-nums}
.prediction-name{font-size:25px;font-weight:950;line-height:1.25;letter-spacing:-.03em;font-family:"Noto Serif TC",Georgia,serif}
.prediction-ko{margin-top:6px;font-size:14px;font-weight:800;color:var(--green-2)}
.prediction-level{display:inline-flex;align-self:flex-start;margin:0 0 8px;padding:4px 8px;border-radius:999px;background:#eef5f0;color:#245c57;font-size:11px;font-weight:900}
.prediction-item.candidate{background:linear-gradient(180deg,#fdfaf3,#f7f1e4);border-style:dashed}
.prediction-item.candidate .prediction-level{background:#f3eee3;color:#775d2e}
.prediction-reason{margin-top:11px;padding-top:10px;border-top:1px dashed #ddd7cc;color:#655f56;font-size:12px;line-height:1.72}
.prediction-reason b{color:#37322c}
.prediction-foot{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.68;border-top:1px dashed var(--line);padding-top:12px}.prediction-foot b{color:var(--ink)}

@media(max-width:820px){
  .entry{grid-template-columns:300px minmax(0,1fr);min-height:248px}
  .entry-info{padding:25px}
  .toolbar{align-items:flex-start}
  .category-nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .category{white-space:nowrap}
  .name{font-size:26px}
}
@media(max-width:720px){.prediction-item{grid-template-columns:205px minmax(0,1fr)}.prediction-info{padding:18px}.prediction-name{font-size:22px}}
@media(max-width:620px){
  .wrap{width:min(100% - 20px,980px)}
  .hero{padding:31px 0 26px}
  .hero-top{gap:12px}
  .source-btn{padding:0 11px;height:40px}
  .toolbar{gap:7px}
  .category,.sort{height:39px;font-size:12px;padding:0 10px}
  .entry{grid-template-columns:42% minmax(0,1fr);min-height:0;border-radius:16px}
  .entry-info{padding:18px 16px}
  .entry-meta{gap:6px;margin-bottom:9px}
  .issue{font-size:10px;padding:5px 8px}
  .date{font-size:11px}
  .name{font-size:20px}
  .ko{font-size:12px;margin-top:5px}
}
@media(max-width:520px){
  .predict-btn{height:38px;padding:0 10px;font-size:12px}
  .prediction-body{padding:14px}
  .prediction-lead{display:block}
  .prediction-badge{display:inline-block;margin-top:10px}
  .prediction-item{display:block}
  .prediction-image{width:100%}
  .prediction-info{padding:15px 16px 17px}
  .prediction-name{font-size:22px}
}
@media(max-width:460px){
  .entry{display:block}
  .image-wrap{width:100%;aspect-ratio:408/340}
  .entry-info{padding:17px 17px 18px}
  .name{font-size:22px}
  .ko{font-size:13px}
  .source-row{grid-template-columns:1fr}
  .source-links{justify-content:flex-start}
  .image-wrap::after{opacity:1;transform:none;font-size:10px;padding:5px 9px}
}


/* pet archive */
.offline-pet-btn{display:none !important;height:41px;border:1px solid #9bb29f;background:linear-gradient(180deg,#f2faf2,#e3efe4);color:#345c45;border-radius:12px;padding:0 13px;cursor:pointer;font-weight:900;font-size:12px;align-items:center;gap:7px;white-space:nowrap}
.offline-pet-btn.show{display:none !important}.offline-pet-btn:hover{border-color:#7e9d84;background:#edf7ee}.offline-pet-btn:disabled{opacity:.55;cursor:wait}
.pet-variants{margin-top:16px;padding-top:13px;border-top:1px dashed #d8cfbf;display:flex;flex-wrap:wrap;gap:7px 9px}.pet-variant{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #ddd4c4;background:#fbf7ef;border-radius:10px;font-size:11px;line-height:1.3;color:#555e56}.pet-rarity{font-size:9px;font-weight:900;color:#fff;border-radius:999px;padding:3px 6px}.pet-rarity.epic{background:#d86f9c}.pet-rarity.elite{background:#8a68b6}.pet-rarity.rare{background:#4f83c3}.pet-rarity.high{background:#5e9469}.pet-image-note{margin-top:10px;color:#8a8174;font-size:10px;line-height:1.55}
.offline-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);z-index:90;max-width:min(520px,calc(100% - 28px));padding:11px 15px;border-radius:999px;background:rgba(35,55,45,.95);color:white;font-size:12px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s ease;text-align:center}.offline-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){.offline-pet-btn{height:39px;padding:0 10px}.pet-variants{margin-top:12px}.pet-variant{font-size:10px;padding:5px 7px}}



/* pet availability filter patch v1 */
.pet-filter-bar{
  display:none;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  flex-wrap:wrap;
  margin-left:auto;
}
.pet-filter-bar.show{display:flex}
.pet-filter-btn{
  height:34px;
  border:1px solid #d2c4a7;
  background:linear-gradient(180deg,#fffdf8,#f4ede0);
  color:#3a4038;
  border-radius:999px;
  padding:0 12px;
  cursor:pointer;
  font-size:12px;
  font-weight:950;
  letter-spacing:.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 2px 5px rgba(55,65,56,.06);
}
.pet-filter-btn:hover{border-color:#b79f70;background:linear-gradient(180deg,#fffefb,#f7efdf)}
.pet-filter-btn.active{
  color:#fff;
  border-color:#496b50;
  background:linear-gradient(180deg,#557963,#2f5f4f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 12px rgba(47,95,79,.15);
}
.pet-filter-btn[data-pet-filter="permanent"].active{
  border-color:#496b50;
  background:linear-gradient(180deg,#557963,#2f5f4f);
}
.pet-filter-btn[data-pet-filter="limited"].active{
  border-color:#9a712b;

/* responsive layout + pet availability filters */
:root{
  --pet-filter-regular:#3f6751;
  --pet-filter-limited:#a7772f;
  --pet-filter-collab:#b86642;
  --pet-filter-collab-2:#884e38;
}
.wrap{width:min(1120px,calc(100% - 28px));}
.toolbar{flex-wrap:wrap;align-items:center;row-gap:10px;}
.category-nav{min-width:0;}
.sort{margin-left:auto;}
.section-head{
  align-items:center;
  flex-wrap:wrap;
  margin:4px 0 16px;
}
.pet-filter-bar{
  display:none;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-left:auto;
}
.pet-filter-bar.show{display:flex;}
.pet-filter{
  height:34px;
  border:1px solid #d2c4a8;
  border-radius:999px;
  padding:0 12px;
  background:linear-gradient(180deg,#fffef9,#f3ecdf);
  color:#3a3a34;
  font-size:12px;
  font-weight:950;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 2px 6px rgba(49,59,48,.06);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  white-space:nowrap;
}
.pet-filter:hover{transform:translateY(-1px);border-color:#b99f72;box-shadow:0 5px 13px rgba(49,59,48,.10);}
.pet-filter.active{color:#fff;border-color:#4f694f;background:linear-gradient(180deg,#4c7055,#325c4d);}
.pet-filter[data-pet="limited"].active{border-color:#a7772f;background:linear-gradient(180deg,#c99a4a,#9a6a24);}
.pet-filter[data-pet="collab"]{
  border-color:#d2a18e;
  color:#694335;
  background:linear-gradient(180deg,#fff6ef,#f6e6db);
}
.pet-filter[data-pet="collab"].active{
  border-color:var(--pet-filter-collab-2);
  color:#fff;
  background:linear-gradient(180deg,var(--pet-filter-collab),var(--pet-filter-collab-2));
  box-shadow:0 4px 14px rgba(136,78,56,.18);
}
.issue.collab{background:linear-gradient(180deg,var(--pet-filter-collab),var(--pet-filter-collab-2)) !important;box-shadow:0 3px 10px rgba(136,78,56,.18) !important;}
.feed{gap:18px;}
.entry{grid-template-columns:minmax(280px,38%) minmax(0,1fr);min-height:286px;}
.image-wrap{height:100%;min-height:260px;}
.image-wrap img{object-position:center center;}
.entry-info{padding:30px clamp(22px,3vw,36px);}
.entry-meta{gap:8px 10px;}
.name{max-width:100%;}
.ko{max-width:100%;}
.pet-variants{gap:7px;}
.pet-variant{max-width:100%;}

@media(min-width:1180px){
  .entry{grid-template-columns:390px minmax(0,1fr);}
  .image-wrap{min-height:300px;}
}
@media(max-width:900px){
  .wrap{width:min(100% - 24px,980px);}
  .hero{padding:34px 0 28px;}
  .toolbar{align-items:flex-start;}
  .category-nav{flex:1 1 100%;order:1;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:4px;scrollbar-width:thin;}
  .category{flex:0 0 auto;white-space:nowrap;}
  .predict-btn,.offline-pet-btn,.sort{order:2;}
  .sort{margin-left:0;}
  main{padding-top:18px;}
  .entry{grid-template-columns:44% minmax(0,1fr);min-height:230px;border-radius:18px;}

  .entry-info{padding:22px 20px;}
  .name{font-size:clamp(22px,3.5vw,28px);}
}

  .hero-top{display:block;}
  .source-btn{margin-top:16px;}
  h1{font-size:clamp(29px,8vw,40px);}
  .toolbar-shell{position:sticky;top:0;}
  .toolbar{padding:10px 0;gap:8px;}
  .category-nav{margin:0 -2px;padding:0 2px 5px;}
  .category,.sort,.predict-btn{height:38px;font-size:12px;border-radius:11px;}
  .sort{max-width:118px;}
  .section-head{display:block;margin:0 0 12px;}
  .section-title{font-size:23px;margin-bottom:10px;}
  .pet-filter-bar{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;padding:1px 0 6px;scrollbar-width:thin;}
  .pet-filter{flex:0 0 auto;height:33px;padding:0 12px;}
  .feed{gap:13px;}
  .entry{display:block;border-radius:18px;min-height:0;}
  .entry::before{inset:8px;border-radius:13px;}
  .image-wrap{width:100%;aspect-ratio:408/340;min-height:0;height:auto;}
  .image-wrap::after{opacity:1;transform:none;font-size:10px;padding:5px 8px;right:10px;bottom:10px;}
  .entry-info{padding:17px 17px 18px;}
  .entry-meta{margin-bottom:9px;}
  .issue{font-size:10px;padding:5px 8px;}
  .date{font-size:11px;}
  .name{font-size:22px;line-height:1.28;}

/* dye preview tool */
.dye-tool{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);
  gap:18px;
  align-items:start;
}
.dye-panel{
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg,#fffdf8,#f7f2e8);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.dye-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  border-bottom:1px solid rgba(201,188,160,.65);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(248,241,226,.78));
}
.dye-panel-title{font-family:"Noto Serif TC",Georgia,serif;font-size:18px;font-weight:950;letter-spacing:-.02em;}
.dye-hex-pill{font-size:12px;font-weight:950;color:#fff;background:linear-gradient(180deg,#4c7055,#325c4d);border-radius:999px;padding:7px 10px;font-variant-numeric:tabular-nums;}
.dye-preview-stage{
  padding:18px;
  background:
    radial-gradient(circle at 18% 14%,rgba(255,255,255,.74),transparent 22%),
    radial-gradient(circle at 80% 18%,rgba(210,185,128,.20),transparent 28%),
    linear-gradient(180deg,#f0f3ec,#e8e5d8);
}
.dye-scene-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.dye-scene{
  height:32px;border:1px solid #d0c3a9;border-radius:999px;padding:0 11px;background:rgba(255,253,247,.82);color:#504b42;font-size:11px;font-weight:900;cursor:pointer;
}
.dye-scene.active{color:#fff;border-color:#4e6b52;background:linear-gradient(180deg,#6f8b70,#4e6d56);}
.dye-preview-card{
  position:relative;
  border:1px solid rgba(118,106,78,.22);
  border-radius:20px;
  overflow:hidden;
  min-height:390px;
  background:linear-gradient(180deg,#f7f3ea,#e9e4d7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 14px 34px rgba(46,57,47,.08);
}
.dye-preview-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.75;
}
.dye-preview-card.scene-day::after{background:linear-gradient(135deg,rgba(255,244,205,.24),rgba(255,255,255,.05));mix-blend-mode:screen;}
.dye-preview-card.scene-cloudy::after{background:linear-gradient(135deg,rgba(145,162,172,.22),rgba(220,230,232,.12));}
.dye-preview-card.scene-night::after{background:linear-gradient(135deg,rgba(17,28,61,.50),rgba(45,58,90,.30));}
.dye-preview-card.scene-warm::after{background:linear-gradient(135deg,rgba(255,206,143,.28),rgba(112,74,36,.08));}
.dye-light-label{position:absolute;left:14px;top:13px;z-index:2;font-size:11px;font-weight:950;color:#4e4739;background:rgba(255,252,246,.82);border:1px solid rgba(190,174,135,.45);border-radius:999px;padding:6px 9px;}
.dye-model{
  --dye:#B6B33B;
  position:absolute;left:50%;top:52%;width:min(310px,72%);height:330px;transform:translate(-50%,-50%);
}
.dye-model .head{position:absolute;left:50%;top:6px;width:70px;height:70px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(160deg,#f1d3bd,#d5a991);box-shadow:inset -8px -10px 18px rgba(101,71,51,.12);}
.dye-model .neck{position:absolute;left:50%;top:72px;width:34px;height:32px;transform:translateX(-50%);border-radius:0 0 16px 16px;background:linear-gradient(160deg,#e3bea6,#c99d85);}
.dye-model .body{position:absolute;left:50%;top:91px;width:150px;height:168px;transform:translateX(-50%);border-radius:34px 34px 42px 42px;background:
  linear-gradient(120deg,rgba(255,255,255,.50),rgba(255,255,255,0) 22%,rgba(0,0,0,.10) 74%,rgba(0,0,0,.18)),
  repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 3px,rgba(0,0,0,.025) 3px 6px),
  var(--dye);box-shadow:inset 16px 0 22px rgba(255,255,255,.18),inset -18px -10px 26px rgba(0,0,0,.16),0 10px 28px rgba(0,0,0,.14);}
.dye-model .body::before{content:"";position:absolute;left:50%;top:10px;width:58px;height:130px;transform:translateX(-50%);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));}
.dye-model .sleeve{position:absolute;top:105px;width:58px;height:126px;border-radius:28px;background:linear-gradient(125deg,rgba(255,255,255,.38),rgba(0,0,0,.12)),var(--dye);box-shadow:inset -10px -8px 18px rgba(0,0,0,.12);}
.dye-model .sleeve.left{left:30px;transform:rotate(13deg)}
.dye-model .sleeve.right{right:30px;transform:rotate(-13deg)}
.dye-model .skirt{position:absolute;left:50%;top:230px;width:210px;height:92px;transform:translateX(-50%);clip-path:polygon(19% 0,81% 0,100% 100%,0 100%);background:
  linear-gradient(115deg,rgba(255,255,255,.38),rgba(255,255,255,0) 26%,rgba(0,0,0,.16)),
  repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 10px,rgba(255,255,255,.06) 10px 17px),
  var(--dye);filter:saturate(1.02);}
.dye-material-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.dye-material{border:1px solid #d7ccb5;border-radius:14px;overflow:hidden;background:#fffdf8;}
.dye-material-swatch{height:54px;background:var(--dye);}
.dye-material.fabric .dye-material-swatch{background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 2px,rgba(0,0,0,.05) 2px 4px),var(--dye);}
.dye-material.silk .dye-material-swatch{background:linear-gradient(115deg,rgba(255,255,255,.62),rgba(255,255,255,.05) 28%,rgba(0,0,0,.20) 68%,rgba(255,255,255,.20)),var(--dye);}
.dye-material.leather .dye-material-swatch{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 19%),linear-gradient(135deg,rgba(0,0,0,.08),rgba(0,0,0,.24)),var(--dye);}
.dye-material.metal .dye-material-swatch{background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.12) 23%,rgba(0,0,0,.28) 51%,rgba(255,255,255,.50) 73%,rgba(0,0,0,.18)),var(--dye);}
.dye-material-label{padding:7px 8px;font-size:11px;font-weight:900;text-align:center;color:#5e574c;}
.dye-controls{padding:18px;}
.dye-input-row{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-bottom:12px;}
.dye-color-input{width:64px;height:44px;border:1px solid #cbbd9e;border-radius:13px;background:#fff;padding:4px;cursor:pointer;}
.dye-text-input{height:44px;border:1px solid #cbbd9e;border-radius:13px;background:#fffdf8;padding:0 13px;font-weight:950;font-size:15px;font-variant-numeric:tabular-nums;color:#343a32;}
.dye-help{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 14px;}
.dye-saved-title{font-size:13px;font-weight:950;margin:14px 0 8px;color:#3e483e;}
.dye-chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dye-chip{height:38px;border:1px solid rgba(120,106,76,.28);border-radius:999px;display:flex;align-items:center;gap:7px;padding:0 9px;background:rgba(255,253,248,.92);cursor:pointer;font-size:11px;font-weight:900;color:#4b463d;box-shadow:0 2px 7px rgba(46,57,47,.06);}
.dye-chip:hover{transform:translateY(-1px);}
.dye-dot{width:17px;height:17px;border-radius:50%;border:1px solid rgba(0,0,0,.16);background:var(--chip);flex:none;}
.dye-note{margin-top:13px;padding:11px 12px;border:1px dashed #d4c7ad;border-radius:14px;background:#fffaf0;color:#6f6658;font-size:11px;line-height:1.65;}
@media(max-width:850px){
  .dye-tool{grid-template-columns:1fr;}
  .dye-panel-head{padding:14px 15px;}
  .dye-preview-stage{padding:14px;}

function addDays(dateString,days){

  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function getTwPassSchedule(number){

  const start=addDays(TW_PASS_PREDICT_BASE,(n-2)*TW_PASS_PREDICT_DAYS);

}
function twScheduleState(schedule){

const PET_DB='mabi-mobile-pet-image-cache-v2';
const PET_STORE='images';
function openPetDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(PET_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(PET_STORE))r.result.createObjectStore(PET_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function petDbGet(key){try{const db=await openPetDb();return await new Promise((res,rej)=>{const r=db.transaction(PET_STORE,'readonly').objectStore(PET_STORE).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}}
async function petDbPut(key,blob){try{const db=await openPetDb();await new Promise((res,rej)=>{const r=db.transaction(PET_STORE,'readwrite').objectStore(PET_STORE).put(blob,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch{}}
function petProxyUrl(url){return `https://images.hsingh.app/?url=${encodeURIComponent(url)}&w=900&output=webp`}
async function fetchPetBlob(item){
  let err;
  for(const url of [item.image,petProxyUrl(item.image)]){
    try{const r=await fetch(url,{mode:'cors',cache:'force-cache'});if(r.ok){const b=await r.blob();if(b.size>1000)return b}}catch(e){err=e}
  }
  throw err||new Error('image fetch failed');
}
function petCacheKey(item){
  const src=item.sourceImage||item.image||'';
  return `${item.id}|${src}`;
}
async function hydratePetImages(){
  const items=DATA.filter(x=>x.type==='pet');
  for(const item of items){
    const img=document.querySelector(`[data-pet-id="${item.id}"] img`);if(!img)continue;
    // 已直接嵌入 HTML 的圖片（例如賞月兔）不使用瀏覽器舊快取覆蓋。
    if((item.image||'').startsWith('data:')){img.src=item.image;continue;}
    const key=petCacheKey(item);
    const cached=await petDbGet(key);
    if(cached){img.src=URL.createObjectURL(cached);img.dataset.offline='1';continue;}
    if(navigator.onLine){fetchPetBlob(item).then(async blob=>{await petDbPut(key,blob);const el=document.querySelector(`[data-pet-id="${item.id}"] img`);if(el){el.src=URL.createObjectURL(blob);el.dataset.offline='1'}}).catch(()=>{})}
  }
}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
let toastTimer;
function showOfflineToast(text){const el=document.getElementById('offlineToast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
async function buildPetOfflineFile(){
  const btn=document.getElementById('offlinePetBtn');const pets=DATA.filter(x=>x.type==='pet');btn.disabled=true;
  const map=new Map();let ok=0,fail=0;
  for(let i=0;i<pets.length;i++){
    const item=pets[i];btn.textContent=`處理圖片 ${i+1}/${pets.length}`;
    try{let blob=(item.image||'').startsWith('data:')?await (await fetch(item.image)).blob():await petDbGet(petCacheKey(item));if(!blob){blob=await fetchPetBlob(item);await petDbPut(petCacheKey(item),blob)};map.set(item.image,await blobToDataURL(blob));ok++}catch{fail++}
  }
  if(!ok){btn.disabled=false;btn.textContent='⬇ 建立寵物離線版';showOfflineToast('圖片下載失敗，請確認目前有網路後再試。');return;}
  const clone=document.documentElement.cloneNode(true);const cloneFeed=clone.querySelector('#feed');if(cloneFeed)cloneFeed.innerHTML='';clone.querySelectorAll('.viewer,.prediction-modal,.source-modal').forEach(x=>x.classList.remove('open'));
  let text='<!doctype html>\n'+clone.outerHTML;
  for(const [url,data] of map){text=text.replace(`\\"image\\":\\"${url}\\"`,`\\"image\\":\\"${data}\\"`);text=text.replace(`"image":"${url}"`,`"image":"${data}"`)}
  const out=new Blob([text],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='瑪奇Mobile韓服外觀圖鑑_歷屆寵物_完整離線版.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  btn.disabled=false;btn.textContent='⬇ 建立寵物離線版';showOfflineToast(fail?`已嵌入 ${ok} 張，另有 ${fail} 張抓取失敗。`:`完成：${ok} 張寵物圖片已嵌入新的 HTML，可完全離線使用。`);
}

function petAvailability(item){
  if(item.type !== 'pet') return 'all';

}
function ensurePetFilterBar(){

  bar = document.createElement('div');
  bar.id = 'petFilterBar';
  bar.className = 'pet-filter-bar';
  bar.setAttribute('aria-label','寵物取得方式篩選');
  bar.innerHTML = Object.entries(PET_FILTER_LABELS).map(([key,label]) =>
    `<button type="button" class="pet-filter-btn" data-pet-filter="${key}">${label}</button>`

function normalizeDyeHex(value){
  let v=String(value||'').trim().toUpperCase();
  if(!v.startsWith('#'))v='#'+v;
  if(/^#[0-9A-F]{3}$/.test(v))v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
  if(/^#[0-9A-F]{6}$/.test(v))return v;
  return null;
}

  document.documentElement.style.setProperty('--dye-preview-color',clean);

  if(model)model.style.setProperty('--dye',clean);
  document.querySelectorAll('.dye-material-swatch').forEach(x=>x.style.backgroundColor=clean);
  const text=document.getElementById('dyeHexInput');
  const color=document.getElementById('dyeColorInput');
  const pill=document.getElementById('dyeHexPill');

  if(color)color.value=clean;
  if(pill)pill.textContent=clean;
}

function normalizeSearchText(value){
  return String(value ?? '').toLowerCase().replace(/\s+/g,' ').trim();
}
function itemSearchText(item){
  return normalizeSearchText([
    item.id,item.type,LABELS[item.type],item.zh,item.ko,item.origin,item.kind,item.date,item.number,
    Array.isArray(item.variants)?item.variants.map(v=>[v.name,v.rarity,v.note].join(' ')).join(' '):''
  ].join(' '));
}
function currentHash(){
  const params=new URLSearchParams(location.hash.replace(/^#/,''));
  return params;
}
function applyHashToState(){
  const params=currentHash();
  const type=params.get('type') || location.hash.replace(/^#/, '').split('&')[0];
  if(type && LABELS[type]) state.type=type;
  const sort=params.get('sort');
  if(sort==='old'||sort==='new') state.sort=sort;
  const q=params.get('q');
  if(q!==null) state.query=q;
  const sortEl=document.getElementById('sort');
  if(sortEl) sortEl.value=state.sort;
  const searchEl=document.getElementById('archiveSearch');
  if(searchEl) searchEl.value=state.query;
}
function updateHash(replace=false){
  const params=new URLSearchParams();
  params.set('type',state.type);
  if(state.sort!=='old') params.set('sort',state.sort);
  if(state.query) params.set('q',state.query);
  const next='#'+params.toString();
  if(location.hash!==next){
    if(replace) history.replaceState(null,'',next); else history.pushState(null,'',next);
  }
}
function updateActiveCategory(){
  document.querySelectorAll('.category').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.type===state.type);
  });
}

function render(){
  updateActiveCategory();
  document.getElementById('sectionTitle').textContent=LABELS[state.type];
  document.getElementById('sectionNote').textContent='';
  document.getElementById('openPrediction').classList.toggle('show',state.type==='lucky');
  document.getElementById('offlinePetBtn').classList.remove('show');
  if(state.type==='dye'){renderDyeTool();return;}
  renderPetFilterBar();
  let rows=DATA.filter(x=>x.type===state.type);
  const query=normalizeSearchText(state.query||'');
  if(query) rows=rows.filter(item=>itemSearchText(item).includes(query));
  if(state.type==='pet'&&state.petFilter&&state.petFilter!=='all') rows=rows.filter(x=>petAvailability(x)===state.petFilter);
  rows.sort((a,b)=>{const d=a.date.localeCompare(b.date)||Number(a.number)-Number(b.number);return state.sort==='old'?d:-d;});
  const countEl=document.getElementById('archiveCount');
  if(countEl) countEl.textContent=query?`找到 ${rows.length} 筆`:`共 ${rows.length} 筆`;
  if(!rows.length){feed.innerHTML=`<div class="empty"><b>${esc(LABELS[state.type])}</b>這個分類目前還沒有加入資料。</div>`;return;}
  feed.innerHTML=rows.map(item=>{
    const issue=item.type==='package'?`第 ${item.number} 代`:item.type==='pet'?petKindLabel(item.kind):(item.type==='abyss'||item.type==='raid')?`第 ${item.number} 套`:`第 ${item.number} 期`;
    const issueClass=item.type==='pet'?(petKindKey(item.kind)==='limited'?'limited':petKindKey(item.kind)==='collab'?'collab':'regular'):'';
    const date=item.type==='package'?`韓服 ${fmt(item.date)} → ${fmt(item.endDate)}`:item.type==='pet'?`韓服 ${fmt(item.date)} → ${fmt(item.endDate)}`:(item.type==='pass'||item.type==='abyss'||item.type==='raid'?'韓服 ':'')+fmt(item.date);
    return `<article class="entry">
      <div class="image-wrap" data-image="${item.id}" ${item.type==='pet'?`data-pet-id="${item.id}"`:''} title="點擊放大">
        <img loading="lazy" src="${item.image}" ${item.sourceImage?`data-fallback="${esc(item.sourceImage)}"`:``} alt="${esc(item.zh)}">
      </div>
      <div class="entry-info">
        <div class="entry-meta"><span class="issue ${issueClass}">${esc(issue)}</span><span class="date">${date}</span></div>
        <div class="name">${esc(item.zh)}</div>
        ${item.ko?`<div class="ko">${esc(item.ko)}</div>`:''}
        ${renderPetVariants(item)}
      </div>
    </article>`;
  }).join('');
  if(!rows.length){feed.innerHTML=`<div class=\"empty-state\">沒有找到符合「${state.query||''}」的資料</div>`;}
  feed.querySelectorAll('img[data-fallback]').forEach(img=>{img.addEventListener('error',()=>{if(img.dataset.fallback&&img.src!==img.dataset.fallback){img.src=img.dataset.fallback;}},{once:true});});
  if(state.type==='pet')hydratePetImages();
}

}
feed.addEventListener('click',e=>{
  const hit=e.target.closest('[data-image]'); if(!hit)return;
  openViewer(DATA.find(x=>x.id===hit.dataset.image));
});

function getLuckyPrediction(){
  return PREDICTION_RANKS.map(cfg=>{
    const item=DATA.find(x=>x.type==='lucky'&&Number(x.number)===cfg.number);
    return item?{...item,...cfg}:null;
  }).filter(Boolean);
}
function buildPrediction(){
  const rows=getLuckyPrediction();
  let mainIndex=0;
  document.getElementById('predictionList').innerHTML=rows.map(item=>{
    const isCandidate=item.kind==='candidate';
    if(!isCandidate)mainIndex+=1;
    const orderLabel=isCandidate?'候補':'主預測 '+mainIndex;
    return `<article class="prediction-item ${isCandidate?'candidate':''}">
      <div class="prediction-image" data-predict-image="${item.id}" title="點擊放大"><img src="${item.image}" alt="${esc(item.zh)}"></div>
      <div class="prediction-info">
        <div class="prediction-order">${orderLabel}</div>
        <div class="prediction-level">${esc(item.level)}</div>
        <div class="prediction-meta">韓服第 ${item.number} 期 · ${fmt(item.date)}</div>
        <div class="prediction-name">${esc(item.zh)}</div>
        ${item.ko?`<div class="prediction-ko">${esc(item.ko)}</div>`:''}
        <div class="prediction-reason"><b>為什麼：</b>${esc(item.reason)}</div>
      </div>
    </article>`;
  }).join('');
  document.getElementById('predictionFoot').innerHTML=`<b>推算基準：</b>台服第一波在本圖鑑可對應 #1、#8，另有「星之誓約」；第二波為 #2、#4、#5。先排除這些已出項目，再參考韓服原始順序與同日成組關係。因台服曾跳號，所以列出 3 套主預測＋1 套候補。基準檔期：${PREDICTION_BASE_DATE}。<br><b>注意：</b>這是整理用推測，不是官方預告。`;
}
function openPrediction(){
  buildPrediction();
  document.getElementById('predictionModal').classList.add('open');
  document.getElementById('predictionModal').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closePrediction(){
  document.getElementById('predictionModal').classList.remove('open');
  document.getElementById('predictionModal').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
document.getElementById('openPrediction').addEventListener('click',openPrediction);
document.getElementById('predictionClose').addEventListener('click',closePrediction);
document.getElementById('predictionModal').addEventListener('click',e=>{
  const hit=e.target.closest('[data-predict-image]');
  if(hit){const item=DATA.find(x=>x.id===hit.dataset.predictImage);closePrediction();openViewer(item);return;}
  if(e.target.id==='predictionModal')closePrediction();
});
function closeViewer(){
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('viewer').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
document.getElementById('viewerClose').addEventListener('click',closeViewer);
document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeViewer()});

function buildSources(){
  const groups=['pass','lucky','package','pet','abyss','raid'];
  document.getElementById('sourceList').innerHTML=groups.map(type=>{
    const rows=DATA.filter(x=>x.type===type).sort((a,b)=>a.date.localeCompare(b.date)||Number(a.number)-Number(b.number));
    if(!rows.length)return '';
    return `<section class="source-group"><h3>${LABELS[type]}</h3>${rows.map(x=>`<div class="source-row">
      <div class="source-label"><b>${x.type==='package'?`第 ${x.number} 代`:x.type==='pet'?petKindLabel(x.kind):(x.type==='abyss'||x.type==='raid')?`第 ${x.number} 套`:`第 ${x.number} 期`}｜${esc(x.zh)}</b><br>${x.type==='package'||x.type==='pet'?`${fmt(x.date)} → ${fmt(x.endDate)}`:fmt(x.date)}${x.origin?`<br>${esc(x.origin)}`:''}</div>
      <div class="source-links">${x.notice?`<a href="${x.notice}" target="_blank" rel="noopener">韓服公告 ↗</a>`:''}${x.sourceImage?`<a href="${x.sourceImage}" target="_blank" rel="noopener">圖片 ↗</a>`:''}${x.type==='pass'&&getTwPassSchedule(x.number)?.notice?`<a href="${getTwPassSchedule(x.number).notice}" target="_blank" rel="noopener">台服公告 ↗</a>`:''}</div>
    </div>`).join('')}</section>`;
  }).join('')+`<section class="source-group"><h3>台版幸運箱預測基準</h3><div class="source-row"><div class="source-label"><b>台服兩波時裝幸運箱對照</b><br>第一波：盛放春光／星之誓約／漣漪的記憶；第二波：熱情之舞／春季運動會／閃耀的應援。預測僅作排序與候補判斷。</div><div class="source-links"><a href="https://forum.gamer.com.tw/C.php?bsn=32564&snA=2263" target="_blank" rel="noopener">第二波 ↗</a><a href="https://mabinogimobile.nipponhashi.com/guides/kr-cash-catalogue/" target="_blank" rel="noopener">台韓對照 ↗</a></div></div></section>`;
}
function openSources(){buildSources();document.getElementById('sourceModal').classList.add('open');document.getElementById('sourceModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeSources(){document.getElementById('sourceModal').classList.remove('open');document.getElementById('sourceModal').setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.getElementById('openSources').addEventListener('click',openSources);
document.getElementById('sourceClose').addEventListener('click',closeSources);
document.getElementById('sourceModal').addEventListener('click',e=>{if(e.target.id==='sourceModal')closeSources()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeViewer();closeSources();closePrediction()}});

const archiveSearch=document.getElementById('archiveSearch');
if(archiveSearch){
  let searchTimer=null;
  archiveSearch.addEventListener('input',e=>{
    state.query=e.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>updateHash(),180);
    render();
  });
}
window.addEventListener('hashchange',()=>{applyHashToState();render();});
applyHashToState();
updateHash(true);

render();
</script>
<div class="offline-toast" id="offlineToast"></div>
